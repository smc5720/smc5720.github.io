<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="JaCoCo HTML 리포트의 클래스별 커버리지 막대와 소스 줄 색상 범례">
  <rect x="0" y="0" width="720" height="420" rx="14" fill="#101012" stroke="#232327"/>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#e6e6e8">
    <text x="24" y="34" font-size="15" font-weight="700" fill="#9a9aa2">index.html : 클래스별 요약</text>

    <rect x="18" y="48" width="684" height="32" fill="#151518"/>
    <text x="30" y="69" font-weight="700">Element</text>
    <text x="250" y="69" font-weight="700">Instructions</text>
    <text x="450" y="69" font-weight="700">Cov.</text>
    <text x="520" y="69" font-weight="700">Branches</text>
    <text x="630" y="69" font-weight="700">Cov.</text>

    <g font-family="ui-monospace, Consolas, monospace">
      <text x="30" y="106">OrderService</text>
      <rect x="250" y="92" width="150" height="14" fill="#e06c6c"/>
      <rect x="250" y="92" width="128" height="14" fill="#4fc08d"/>
      <text x="450" y="106">85%</text>
      <text x="520" y="106" font-family="Pretendard, system-ui, sans-serif">3 / 6</text>
      <text x="630" y="106">50%</text>

      <text x="30" y="142">DiscountPolicy</text>
      <rect x="250" y="128" width="90" height="14" fill="#e06c6c"/>
      <rect x="250" y="128" width="90" height="14" fill="#4fc08d" fill-opacity="0"/>
      <rect x="250" y="128" width="54" height="14" fill="#4fc08d"/>
      <text x="450" y="142">60%</text>
      <text x="520" y="142" font-family="Pretendard, system-ui, sans-serif">1 / 4</text>
      <text x="630" y="142">25%</text>

      <text x="30" y="178">PaymentClient</text>
      <rect x="250" y="164" width="150" height="14" fill="#4fc08d"/>
      <text x="450" y="178">100%</text>
      <text x="520" y="178" fill="#9a9aa2" font-family="Pretendard, system-ui, sans-serif">n/a</text>
      <text x="630" y="178" fill="#9a9aa2">n/a</text>
    </g>
    <text x="30" y="212" fill="#9a9aa2">막대의 빨강이 아직 실행된 적 없는 명령어, 초록이 실행된 명령어다</text>

    <line x1="18" y1="230" x2="702" y2="230" stroke="#232327"/>
    <text x="24" y="256" font-size="15" font-weight="700" fill="#9a9aa2">DiscountPolicy.java.html : 소스 줄 색상</text>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#e6e6e8">
    <rect x="18" y="270" width="684" height="30" fill="#4fc08d" fill-opacity="0.18"/>
    <rect x="18" y="300" width="684" height="30" fill="#e0c070" fill-opacity="0.22"/>
    <rect x="18" y="330" width="684" height="30" fill="#e06c6c" fill-opacity="0.2"/>
    <text x="70" y="291">int d = 0;</text>
    <text x="70" y="321">if (vip) d = 10;</text>
    <text x="70" y="351">throw new IllegalStateException();</text>
    <polygon points="30,315 38,306 46,315 38,324" fill="#e0c070"/>
    <polygon points="30,345 38,336 46,345 38,354" fill="#e06c6c"/>
  </g>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#e6e6e8">
    <text x="440" y="291" fill="#4fc08d">초록: 전부 실행</text>
    <text x="440" y="321" fill="#e0c070">노랑: 일부만 실행</text>
    <text x="440" y="351" fill="#e06c6c">빨강: 한 번도 실행 안 됨</text>
    <text x="24" y="390" fill="#9a9aa2">줄 왼쪽의 마름모는 분기 : 노랑은 한쪽만 탐, 빨강은 둘 다 안 탐</text>
  </g>
</svg>
