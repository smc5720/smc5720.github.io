<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d" font-family="Pretendard, system-ui, sans-serif">
  <title id="t">대시보드 예시</title>
  <desc id="d">프로젝트 Overview 화면을 흉내 낸 가상의 예시. Quality Gate Passed, Reliability A, Security A, Maintainability B, 커버리지 83.2%, 중복 1.8%, 핫스팟 검토 100%.</desc>
  <rect x="0" y="0" width="720" height="420" rx="14" fill="#101012" stroke="#232327"/>

  <text x="28" y="44" font-size="17" fill="#e6e6e8" font-weight="600">shop-api</text>
  <text x="112" y="44" font-size="14" fill="#9a9aa2">main</text>
  <rect x="470" y="22" width="110" height="32" rx="16" fill="none" stroke="#4fc08d"/>
