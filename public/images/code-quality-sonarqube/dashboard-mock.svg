    <text x="224" y="236" font-size="14" fill="#9a9aa2" text-anchor="end">새 이슈 0</text>

    <rect x="254" y="140" width="212" height="112" rx="8" fill="#16161a" stroke="#232327"/>
    <text x="270" y="166" font-size="14" fill="#9a9aa2">Reliability</text>
    <text x="270" y="216" font-size="40" fill="#4fc08d" font-weight="700">A</text>
    <text x="450" y="236" font-size="14" fill="#9a9aa2" text-anchor="end">새 이슈 0</text>

    <rect x="480" y="140" width="212" height="112" rx="8" fill="#16161a" stroke="#232327"/>
    <text x="496" y="166" font-size="14" fill="#9a9aa2">Maintainability</text>
    <text x="496" y="216" font-size="40" fill="#a8c96a" font-weight="700">B</text>
    <text x="676" y="236" font-size="14" fill="#9a9aa2" text-anchor="end">부채 2h 10m</text>
  </g>
  <g>
    <rect x="28" y="266" width="212" height="86" rx="8" fill="#16161a" stroke="#232327"/>
    <text x="44" y="292" font-size="14" fill="#9a9aa2">Coverage</text>
    <text x="44" y="334" font-size="28" fill="#6aa5ff" font-weight="700">83.2%</text>

    <rect x="254" y="266" width="212" height="86" rx="8" fill="#16161a" stroke="#232327"/>
    <text x="270" y="292" font-size="14" fill="#9a9aa2">Duplications</text>
    <text x="270" y="334" font-size="28" fill="#6aa5ff" font-weight="700">1.8%</text>

    <rect x="480" y="266" width="212" height="86" rx="8" fill="#16161a" stroke="#232327"/>
    <text x="496" y="292" font-size="14" fill="#9a9aa2">Hotspots 검토</text>
    <text x="496" y="334" font-size="28" fill="#6aa5ff" font-weight="700">100%</text>
