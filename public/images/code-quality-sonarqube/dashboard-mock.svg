  <rect x="588" y="22" width="110" height="32" rx="16" fill="none" stroke="#232327"/>
  <text x="643" y="44" font-size="14" fill="#9a9aa2" text-anchor="middle">전체 코드</text>

  <rect x="28" y="70" width="664" height="52" rx="8" fill="#16161a" stroke="#4fc08d"/>
