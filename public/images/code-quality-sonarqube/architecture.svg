<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="Pretendard, system-ui, sans-serif">
  <title id="t">SonarQube 아키텍처</title>
  <desc id="d">리포트와 소스를 읽은 Scanner가 분석 결과를 Web Server에 올리고, Compute Engine이 처리해 DB에 저장하며, 브라우저는 Web Server를 통해 결과를 본다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9aa2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="360" rx="14" fill="#101012" stroke="#232327"/>

  <rect x="248" y="24" width="448" height="312" rx="12" fill="none" stroke="#6aa5ff" stroke-dasharray="6 5"/>
  <text x="264" y="48" font-size="14" fill="#6aa5ff" font-weight="600">SonarQube Server</text>

  <rect x="24" y="64" width="160" height="64" rx="8" fill="#16161a" stroke="#232327"/>
  <text x="104" y="92" font-size="15" fill="#e6e6e8" text-anchor="middle">소스 코드</text>
  <text x="104" y="114" font-size="14" fill="#9a9aa2" text-anchor="middle">+ jacoco.xml</text>

  <rect x="24" y="168" width="160" height="64" rx="8" fill="#16161a" stroke="#4fc08d"/>
  <text x="104" y="196" font-size="15" fill="#4fc08d" text-anchor="middle" font-weight="600">Scanner</text>
  <text x="104" y="218" font-size="14" fill="#9a9aa2" text-anchor="middle">CI에서 실행</text>

  <rect x="24" y="264" width="160" height="56" rx="8" fill="#16161a" stroke="#232327"/>
  <text x="104" y="298" font-size="15" fill="#e6e6e8" text-anchor="middle">브라우저</text>

  <rect x="268" y="168" width="170" height="64" rx="8" fill="#16161a" stroke="#6aa5ff"/>
  <text x="353" y="196" font-size="15" fill="#e6e6e8" text-anchor="middle">Web Server</text>
  <text x="353" y="218" font-size="14" fill="#9a9aa2" text-anchor="middle">UI / API</text>

  <rect x="268" y="64" width="170" height="64" rx="8" fill="#16161a" stroke="#6aa5ff"/>
  <text x="353" y="92" font-size="15" fill="#e6e6e8" text-anchor="middle">Compute Engine</text>
  <text x="353" y="114" font-size="14" fill="#9a9aa2" text-anchor="middle">리포트 계산</text>

  <rect x="500" y="64" width="176" height="64" rx="8" fill="#16161a" stroke="#e0c070"/>
  <text x="588" y="92" font-size="15" fill="#e0c070" text-anchor="middle">DB</text>
  <text x="588" y="114" font-size="14" fill="#9a9aa2" text-anchor="middle">PostgreSQL 등</text>

  <rect x="500" y="168" width="176" height="64" rx="8" fill="#16161a" stroke="#e0c070"/>
  <text x="588" y="196" font-size="15" fill="#e0c070" text-anchor="middle">Elasticsearch</text>
  <text x="588" y="218" font-size="14" fill="#9a9aa2" text-anchor="middle">이슈 검색 색인</text>

  <g stroke="#9a9aa2" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M104 128 V166"/>
    <path d="M184 200 H266"/>
    <path d="M353 166 V130"/>
    <path d="M438 96 H498"/>
    <path d="M438 200 H498"/>
    <path d="M184 292 H353 V234"/>
  </g>

  <g font-size="14" fill="#e6e6e8" font-weight="600">
    <text x="112" y="152">1</text>
    <text x="215" y="190" text-anchor="middle">2</text>
    <text x="362" y="152">3</text>
    <text x="468" y="86" text-anchor="middle">4</text>
    <text x="260" y="284">5</text>
  </g>
  <text x="268" y="322" font-size="14" fill="#9a9aa2">1 분석  2 업로드  3 큐  4 저장  5 조회</text>
</svg>
