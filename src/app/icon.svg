<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- v3 마크: R + 액센트 바. 배경은 항상 불투명(color-bg #0c0c0d) -->
  <rect width="32" height="32" rx="5" fill="#0c0c0d"/>
  <!-- R: color-fg-strong(#ffffff), font-weight 700, letter-spacing -0.04em -->
  <text x="16" y="20.5" text-anchor="middle" fill="#ffffff" font-family="Pretendard, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="-0.6">R</text>
  <!-- 액센트 바: 14x2, radius 1. color-accent oklch(0.74 0.13 155) to sRGB is #5ec386 -->
  <rect x="9" y="23" width="14" height="2" rx="1" fill="#5ec386"/>
</svg>
