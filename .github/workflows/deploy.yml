name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    # 러너 이미지 전환(예: ubuntu-latest → 26.04) 전에 수동 실행으로 미리 검증한다
    inputs:
      runner:
        description: "Runner image"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 빌드는 첫 MDX 오류에서 멈추므로, 깨진 글 전체를 수 초 안에 먼저 나열한다
      - name: Validate MDX
        run: pnpm validate:mdx

      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ca-pub-8344215225561043
          NEXT_PUBLIC_ADSENSE_SLOT_TOP: "5754924099"
          NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM: "1259445654"
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_GISCUS_REPO: smc5720/smc5720.github.io
          NEXT_PUBLIC_GISCUS_REPO_ID: R_kgDOGkqz4Q
          NEXT_PUBLIC_GISCUS_CATEGORY: Announcements
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDOGkqz4c4C9Wgf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
